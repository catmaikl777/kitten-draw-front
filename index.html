<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Drawing Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar с проектами -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-palette"></i> Мои проекты</h2>
                <div class="header-actions">
                    <button id="newProjectBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Новый проект
                    </button>
                    <button id="newFolderBtn" class="btn-secondary">
                        <i class="fas fa-folder-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Поиск и фильтры -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="projectSearch" placeholder="Поиск проектов...">
                </div>
                <select id="projectFilter">
                    <option value="all">Все проекты</option>
                    <option value="recent">Недавние</option>
                    <option value="favorites">Избранные</option>
                </select>
            </div>

            <div class="projects-list" id="projectsList">
                <!-- Проекты будут добавляться здесь -->
            </div>
        </div>

        <!-- Основная область -->
        <div class="main-content">
            <!-- Верхняя панель -->
            <div class="top-panel">
                <div class="project-info">
                    <h3 id="currentProjectName">Новый проект</h3>
                    <div class="project-actions">
                        <button id="renameBtn" class="btn-icon" title="Переименовать">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button id="favoriteBtn" class="btn-icon" title="В избранное">
                            <i class="far fa-star"></i>
                        </button>
                        <button id="duplicateBtn" class="btn-icon" title="Дублировать">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="history-controls">
                    <button id="undoBtn" class="btn-icon" title="Отменить (Ctrl+Z)">
                        <i class="fas fa-undo"></i>
                    </button>
                    <button id="redoBtn" class="btn-icon" title="Вернуть (Ctrl+Y)">
                        <i class="fas fa-redo"></i>
                    </button>
                    <span class="history-stats" id="historyStats">0/0</span>
                </div>
            </div>

            <!-- Панель инструментов редактора -->
            <div class="toolbar">
                <!-- Инструменты рисования -->
                <div class="tool-group">
                    <span class="tool-label">Инструменты:</span>
                    <button id="brushTool" class="tool-btn active" title="Кисть (B)">
                        <i class="fas fa-paint-brush"></i>
                    </button>
                    <button id="eraserTool" class="tool-btn" title="Ластик (E)">
                        <i class="fas fa-eraser"></i>
                    </button>
                    <button id="shapeTool" class="tool-btn" title="Фигуры (S)">
                        <i class="fas fa-shapes"></i>
                    </button>
                    <button id="textTool" class="tool-btn" title="Текст (T)">
                        <i class="fas fa-font"></i>
                    </button>
                    <button id="fillTool" class="tool-btn" title="Заливка (F)">
                        <i class="fas fa-fill-drip"></i>
                    </button>
                </div>

                <!-- Настройки кисти -->
                <div class="tool-group">
                    <span class="tool-label">Кисть:</span>
                    <input type="color" id="colorPicker" value="#000000" title="Цвет">
                    <input type="range" id="brushSize" min="1" max="100" value="5" title="Размер кисти">
                    <span id="brushSizeValue">5px</span>
                    
                    <select id="brushType" title="Тип кисти">
                        <option value="round">Круглая</option>
                        <option value="square">Квадратная</option>
                        <option value="spray">Распылитель</option>
                    </select>
                </div>

                <!-- Слои -->
                <div class="tool-group">
                    <span class="tool-label">Слои:</span>
                    <button id="addLayerBtn" class="btn-icon" title="Добавить слой">
                        <i class="fas fa-layer-plus"></i>
                    </button>
                    <button id="mergeLayersBtn" class="btn-icon" title="Объединить слои">
                        <i class="fas fa-object-group"></i>
                    </button>
                    <select id="layerBlendMode" title="Режим наложения">
                        <option value="source-over">Нормальный</option>
                        <option value="multiply">Умножение</option>
                        <option value="screen">Осветление</option>
                        <option value="overlay">Перекрытие</option>
                    </select>
                </div>

                <!-- Действия -->
                <div class="tool-group">
                    <button id="saveBtn" class="btn-success">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                    <button id="clearBtn" class="btn-warning">
                        <i class="fas fa-broom"></i> Очистить
                    </button>
                    <button id="exportBtn" class="btn-info">
                        <i class="fas fa-download"></i> Экспорт
                    </button>
                </div>
            </div>

            <!-- Основная рабочая область -->
            <div class="work-area">
                <!-- Панель слоев -->
                <div class="layers-panel">
                    <div class="panel-header">
                        <h4><i class="fas fa-layer-group"></i> Слои</h4>
                        <button id="toggleLayers" class="btn-icon">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="layers-list" id="layersList">
                        <!-- Слои будут здесь -->
                    </div>
                </div>

                <!-- Контейнер холста -->
                <div class="canvas-container">
                    <canvas id="drawingCanvas"></canvas>
                    <canvas id="canvasOverlay"></canvas>
                </div>

                <!-- Панель свойств -->
                <div class="properties-panel">
                    <div class="panel-header">
                        <h4><i class="fas fa-sliders-h"></i> Свойства</h4>
                    </div>
                    <div class="properties-content">
                        <div class="property-group">
                            <label>Название проекта:</label>
                            <input type="text" id="projectNameInput" class="property-input">
                        </div>
                        <div class="property-group">
                            <label>Размер холста:</label>
                            <select id="canvasSize" class="property-input">
                                <option value="custom">Произвольный</option>
                                <option value="800x600">800x600</option>
                                <option value="1024x768">1024x768</option>
                                <option value="1920x1080">1920x1080</option>
                            </select>
                        </div>
                        <div class="property-group">
                            <label>Фон:</label>
                            <input type="color" id="backgroundColor" value="#ffffff" class="property-input">
                        </div>
                        <div class="property-group">
                            <label>Фильтры:</label>
                            <select id="imageFilters" class="property-input">
                                <option value="none">Без фильтра</option>
                                <option value="grayscale">Черно-белый</option>
                                <option value="sepia">Сепия</option>
                                <option value="invert">Инверсия</option>
                                <option value="blur">Размытие</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Статус бар -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="cursorPosition">X: 0, Y: 0</span>
                    <span id="zoomLevel">100%</span>
                </div>
                <div class="status-right">
                    <span id="projectStats">Слоев: 1 | Размер: 800x600</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальные окна -->
    <div id="newProjectModal" class="modal">
        <div class="modal-content">
            <h3>Новый проект</h3>
            <div class="modal-body">
                <div class="template-gallery">
                    <div class="template-item" data-size="800x600">
                        <div class="template-preview"></div>
                        <span>800x600</span>
                    </div>
                    <div class="template-item" data-size="1024x768">
                        <div class="template-preview"></div>
                        <span>1024x768</span>
                    </div>
                    <div class="template-item" data-size="1920x1080">
                        <div class="template-preview"></div>
                        <span>1920x1080</span>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="confirmNewProject" class="btn-primary">Создать</button>
                <button id="cancelNewProject" class="btn-secondary">Отмена</button>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
